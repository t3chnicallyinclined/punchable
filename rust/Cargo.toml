[workspace]
resolver = "3"
members = [
    "crates/pk-core",
    "crates/pk-kb",
    "crates/pk-creative",
    "crates/pk-store",
    "crates/pk-llm",
    "crates/pk-embed",
    "crates/pk-obs",
    "crates/pk-api",
    "crates/pk-worker",
    "crates/pk-wire",
    "crates/pk-engine",
    "crates/pk-fts",
    "xtask",
    "tools/pk-load",
]

# The Rust port of Punchable's services (docs/RUST.md). One workspace, a DAG of crates:
#   pk-kb (the graph, no IO) <- pk-creative (the rules, no IO)
#   pk-store (SurrealDB) · pk-llm (Anthropic) · pk-embed (bge-small) · pk-obs (tracing, metrics, sentry)
#   pk-api (axum) · pk-worker (the job loop); the binaries never depend on each other.
# Gates run per crate: `cargo test -p pk-kb`, never `--workspace` (docs/RUST.md "Build, CI, images").

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# the workspace leaf (ADR 0010): the Python-format helpers, the clock, the one reader of the environment
pk-core = { path = "crates/pk-core" }
# the crates we stand on (docs/RUST.md "Crates we stand on"); versions pinned here, used by `.workspace = true`
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
anyhow = "1"
regex = "1"
sha1 = "0.10"
sha2 = "0.11"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
axum = { version = "0.8", features = ["ws", "json", "macros"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
eventsource-stream = "0.2"
uuid = { version = "1", features = ["v4"] }
# surrealdb: "=3.2.6" is the last 3.x whose family builds on the pinned 1.93.1 toolchain (rust-toolchain.toml): every
# 3.3.x surrealdb-common uses std::hint::cold_path, stable only in a newer Rust. The client accepts servers
# >=3.0.0-alpha.1, <4.0.0, so it talks to the 3.3.4 server. Moving the toolchain forward lets this become 3.3.x.
surrealdb = { version = "=3.2.6", default-features = false, features = ["protocol-ws", "rustls"] }
# jsonwebtoken: 10 with the aws-lc-rs backend, the build surrealdb-core already pulls in (one crypto stack in the
# tree); pk-api uses it for the RS256 signature check only (docs/ARCHITECTURE.md section 2)
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
prometheus = "0.14"
sentry = { version = "0.42", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
jsonschema = { version = "0.33", default-features = false }
toml = "0.9"
# pk-embed: ort rc.15 wraps ONNX Runtime 1.31; default features download pyke's prebuilt binaries at build time
ort = { version = "=2.0.0-rc.15", features = ["ndarray"] }
# pk-embed: the same release as the Python wheel the goldens were made with (tokenizers==0.22.1)
tokenizers = { version = "=0.22.1", default-features = false, features = ["onig"] }
ndarray = "0.17"
clap = { version = "4", features = ["derive"] }
# pk-api: base64url read as leniently as Python's urlsafe_b64decode reads a token; Python's parse_qs for query strings
base64 = "0.22"
form_urlencoded = "1"
# pk-api /api/map/cloud: the symmetric eigen-decomposition behind the PCA (pure Rust, no LAPACK)
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
tower = { version = "0.5", features = ["util"] }
# pk-wire (feature `ts`, off by default): the app's TypeScript types from the wire structs after T9
ts-rs = { version = "=12.0.1", features = ["serde-json-impl"] }
# pk-load and the pk-embed memprobe example (T15, T17): a process's resident memory on Linux, Windows and macOS;
# 0.38 is the last line that builds on the pinned 1.93.1 toolchain (0.39+ needs Rust 1.95)
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
# pk-engine (ADR 0013): the Snowball English stemmer, the same algorithm as the `punch_en` analyzer's snowball(english)
rust-stemmers = "1"
# pk-worker (T8): the cancellation token for the claim loop and its jobs; `urllib.parse.quote` for a job id in a path;
# `html.unescape` for the fact-check pages
tokio-util = { version = "0.7", default-features = false }
percent-encoding = "2"
html-escape = "0.2"
# pk-fts (T8 `ask`): SQLite FTS5 compiled from the amalgamation, so `bm25()` and the porter tokenizer are the ones the
# Python's sqlite3 runs; 0.41 builds on the pinned 1.93.1 toolchain (MSRV 1.89)
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
# tests
insta ={ version = "1", features = ["json"] }
proptest = "1"
wiremock = "0.6"
tempfile = "3"
# pk-api tests: a throwaway RSA key made at test time (the aws-lc-rs jsonwebtoken already uses), never a committed key
aws-lc-rs = "1"
# pk-api tests: the client side of `/api/live` (the same crate axum's `ws` feature serves it with)
tokio-tungstenite = "0.29"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# pedantic lints we turn off on purpose: the domain is JSON maps and the Python it mirrors
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
debug = 0

[profile.dev]
debug = 0
