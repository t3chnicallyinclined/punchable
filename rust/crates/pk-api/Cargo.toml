[package]
name = "pk-api"
description = "Punchable's API on axum: Keycloak bearer auth, CORS, /metrics, the snapshot and the read routes (T9); the rest proxied to the Python API until T10"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `diagnostics`: GET /api/_t9/summaries, the whole Bits-list row this service computes, so the T9 differential can
# compare it with the Python's /api/jokes before that route moves. Never in a shipped image.
diagnostics = ["dep:aws-lc-rs"]

# The S3 stand-in the recordings tests and the differentials run against (tests/support/s3_standin.rs): a program for
# the checkout, never in a shipped image (the Dockerfile builds `-p pk-api` without the feature).
[[bin]]
name = "pk-api"
path = "src/main.rs"

[[bin]]
name = "pk-s3-standin"
path = "src/bin/pk_s3_standin.rs"
required-features = ["diagnostics"]

[dependencies]
anyhow = { workspace = true }
aws-lc-rs = { workspace = true, optional = true }
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
form_urlencoded = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
indexmap = { workspace = true }
percent-encoding = { workspace = true }
jsonwebtoken = { workspace = true }
nalgebra = { workspace = true }
pk-core = { workspace = true }
pk-creative = { path = "../pk-creative" }
pk-embed = { path = "../pk-embed" }
pk-kb = { path = "../pk-kb" }
pk-obs = { path = "../pk-obs" }
pk-store = { path = "../pk-store" }
pk-wire = { path = "../pk-wire" }
prometheus = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rusty-s3 = { workspace = true }
sentry = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tower = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
aws-lc-rs = { workspace = true }
sysinfo = { workspace = true }
tempfile = { workspace = true }
tokio-tungstenite = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true
