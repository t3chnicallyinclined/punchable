# The Rust services' gate (docs/RUST.md "Build, CI, images"): format, clippy with warnings denied, the tests, per
# crate, through `cargo xtask gate`, so CI and a laptop run the same thing. The goldens under crates/*/tests/goldens
# are committed (synthetic fixtures); the "goldens are current" job regenerates them with the repo's Python and
# fails if they drift, so a change to the Python replay cannot land without the Rust side seeing it.
name: rust

on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'tools/explorer/kb.py'
      - 'creative/**'
      - 'engine/**'
      - 'api-dev/metrics.py'
      - 'api-dev/scrub.py'
      - 'api-dev/search_api.py'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'tools/explorer/kb.py'
      - 'creative/**'
      - 'engine/**'
      - 'api-dev/metrics.py'
      - 'api-dev/scrub.py'
      - 'api-dev/search_api.py'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          # rust/rust-toolchain.toml pins the channel; the action only adds the components
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Gate (fmt, clippy -D warnings, tests, per crate)
        run: cargo xtask gate

  goldens-current:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install the Python the generators import
        # the API image's pins + the worker's SDK pin (gen_llm_goldens.py drives the real anthropic SDK through a mock
        # transport; never the network) + numpy for the hash embedder. The bge model is not fetched here, so the
        # pk-embed model goldens are regenerated only where PK_BGE_DIR is set (they stay as committed).
        run: python -m pip install -r api/requirements.txt anthropic==0.104.1 jsonschema==4.26.0 httpx==0.28.1

      - name: Regenerate the goldens from the Python they replace
        run: |
          python rust/tools/gen_kb_goldens.py
          python rust/tools/gen_creative_goldens.py
          python rust/tools/gen_obs_goldens.py
          python rust/tools/gen_llm_goldens.py
          python rust/tools/gen_embed_goldens.py
          python rust/tools/gen_wire_goldens.py

      - name: The committed goldens match
        run: git diff --exit-code -- rust/crates/*/tests/goldens
