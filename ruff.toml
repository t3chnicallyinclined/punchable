# ruff, narrow on purpose (docs/ARCHITECTURE.md section 6): only E9 (syntax errors, undefined names at module level)
# and F (pyflakes: undefined names, unused imports and variables, redefinitions) over the shipped Python and its
# tests. No style rules: the Python is the oracle the Rust replaces (docs/RUST.md), not a codebase being groomed.
# Run: `ruff check .` at the repo root (CI: .github/workflows/api.yml, ruff 0.17.3). Never `--add-noqa`: fix or report.
target-version = "py313"
include = [
    "api-dev/**/*.py",
    "api/**/*.py",
    "creative/**/*.py",
    "engine/**/*.py",
    "worker/**/*.py",
    "db/**/*.py",
    "infer/**/*.py",
    "gsync/rules.py",
    "tools/explorer/kb.py",
]

[lint]
select = ["E9", "F"]
