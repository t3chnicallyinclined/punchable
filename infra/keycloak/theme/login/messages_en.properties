# Plain-word overrides of Keycloak's default English messages: errors say what happened and what to do; no jokes.
# Anything not listed falls back to the base theme's wording. Installed at login/messages/.
# The pages this theme overrides carry their own copy; these keys also reach the base pages we don't override
# (login-otp, login-username, select-authenticator, ...) so they read in the same voice inside our layout.
# A single quote is doubled ('') because the values go through MessageFormat.
