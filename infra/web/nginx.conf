# Static Expo web export. TLS, HSTS and rate limits are the ingress's job; this only serves files.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), geolocation=(self), microphone=(self)" always;

    location ^~ /dev-fixtures/ { return 404; }   # local-dev material, never public
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # Universal Links (app.json ios.associatedDomains): Apple fetches this with no redirect and needs JSON, so it
    # must not fall through to index.html. The TEAMID placeholder is filled at build time from PK_APPLE_TEAM_ID.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Hashed bundles never change: cache for a year.
    location /_expo/static/ { expires 1y; add_header Cache-Control "public, immutable" always; try_files $uri =404; }

    # Single-page app (app.json web.output = "single"): unknown paths, including /auth/callback, get index.html.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), geolocation=(self), microphone=(self)" always;
        try_files $uri $uri.html /index.html;
    }
}
