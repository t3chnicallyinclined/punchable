# Nightly SurrealDB backup to R2 (infra/backup/backup.py, infra/README.md "Backups").
# 04:17 UTC: export punchable/main over HTTP as the DATABASE user `api` (EDITOR; never root: a database user's export is
# byte-identical to root's, checked 2026-10-26), gzip, check, PUT to R2 under surreal/daily/, a weekly copy on Sundays,
# keep 14 daily + 8 weekly. Applied by `infra/ship.sh backup` (which first makes the ConfigMap from backup.py).
#   ConfigMap punchable-backup-script   backup.py (made from the committed file by deploy.sh backup; not here)
#   Secret punchable-r2-backup          R2_ENDPOINT, R2_BUCKET, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY: a token scoped to
#                                       the backup bucket only (infra/ship.sh backup-secret; never in git)
# NetworkPolicy punchable-backup (10-networkpolicy.yaml): out to surrealdb:8000 and TCP 443 on the public internet only.
# Since the crash-report store (70-bugsink.yaml): the same Job also copies Bugsink's SQLite (sqlite3's online backup API,
# then gzip, integrity_check, PUT under bugsink/daily|weekly, same retention). Its PVC is mounted here read-write because
# a WAL-mode reader needs the -shm file; the job only ever reads, and it runs as Bugsink's uid (see securityContext). The PVC must exist (infra/ship.sh bugsink) before
# `infra/ship.sh backup` applies this file, or the pod stays Pending.
apiVersion: batch/v1
kind: CronJob
metadata: { name: punchable-backup, namespace: punchable, labels: { app: punchable-backup } }
spec:
  schedule: "17 4 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata: { labels: { app: punchable-backup } }
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      # also cleans up the jobs `infra/ship.sh backup-now` creates (the history limits only count scheduled runs)
      ttlSecondsAfterFinished: 604800
      template:
        metadata: { labels: { app: punchable-backup } }
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          # uid 14237 = Bugsink's own user (70-bugsink.yaml). A WAL-mode reader CREATES db.sqlite3-shm/-wal when they are
          # absent, owned by whoever opened it, mode 644: run as any other uid and Bugsink can no longer write its own
          # database after the first backup ("attempt to write a readonly database", seen 2026-10-28). Same uid, no trap.
          securityContext:
            runAsNonRoot: true
            runAsUser: 14237
            runAsGroup: 14237
            fsGroup: 14237
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: backup
              image: python:3.13-slim-bookworm@sha256:e32be0e55814a08977501ca863271d9bd02443710db8f2afaf8372e2c4508530
              command: ["python", "-I", "/opt/backup/backup.py", "run"]
              env:
                - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
                - { name: SURREAL_URL, value: "http://surrealdb:8000" }
                - { name: SURREAL_NS, value: punchable }
                - { name: SURREAL_DB, value: main }
                - { name: SURREAL_AUTH_LEVEL, value: database }
                - name: SURREAL_USER
                  valueFrom: { secretKeyRef: { name: punchable-api, key: SURREAL_API_USER } }
                - name: SURREAL_PASS
                  valueFrom: { secretKeyRef: { name: punchable-api, key: SURREAL_API_PASS } }
                - { name: R2_REGION, value: auto }
                - { name: BACKUP_PREFIX, value: surreal/ }
                - { name: BACKUP_KEEP_DAILY, value: "14" }
                - { name: BACKUP_KEEP_WEEKLY, value: "8" }
                - { name: BACKUP_WEEKLY, value: auto }
                - { name: BACKUP_TMP, value: /tmp }
                - { name: BUGSINK_DB_PATH, value: /bugsink/db.sqlite3 }
                - { name: BUGSINK_PREFIX, value: bugsink/ }
              envFrom:
                - secretRef: { name: punchable-r2-backup }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              # Streams in 1 MiB chunks; the dump is ~31 MB of SurrealQL, ~11 MB gzipped (2026-10-26).
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
                - { name: script, mountPath: /opt/backup, readOnly: true }
                - { name: bugsink, mountPath: /bugsink, readOnly: false }
          volumes:
            - name: tmp
              # the SurrealDB dump (~11 MB gz) and the Bugsink copy (bounded by its 2 Gi PVC) both stage here
              emptyDir: { sizeLimit: 2Gi }
            - name: bugsink
              persistentVolumeClaim: { claimName: punchable-bugsink-data }
            - name: script
              configMap: { name: punchable-backup-script, defaultMode: 0444 }
