# PREPARED, NOT APPLIED (lane T9, 2026-11-02; lane T10 adds the writes, 2026-11-03). Nothing in infra/ship.sh reads this folder; applying it is the owner's
# call, after the Rust image is built off the node (docs/ARCHITECTURE.md section 6) and its digest is in the private
# deploy log with this rollback: `kubectl -n punchable delete ingress punchable-api-rs` (the Python takes every path
# back at once: its Ingress, 50-ingress.yaml, is not touched), then delete the rest of this file's objects.
#
# What it adds, beside the Python API (30-api.yaml), never instead of it:
#   - pk-api as its own Deployment + Service (`app: punchable-api-rs`, `impl: rust`), so no Grafana panel mixes the two
#     (the Prometheus job is `punchable-api-rs`; `impl` is copied onto every series by podTargetLabels).
#   - an Ingress with EXACT paths for the routes pk-api answers itself (pk-api `OWN_PATHS` for the GETs,
#     `OWN_WRITE_PATHS` for the POSTs). An exact path still routes every method, so pk-api forwards any method it does
#     not answer to the Python Service unchanged (`PK_PYTHON_URL`, crates/pk-api/src/proxy.rs): a write can never be
#     swallowed. No prefix moves: `/api/jokes`, `/api/sets`, `/api/map` carry routes of both kinds and stay split by
#     exact and regex paths until the Python is retired (T11).
#   - NetworkPolicies, additive only (policies are a union): pk-api in from the ingress host and Prometheus; out to
#     SurrealDB, the Python API (the fallback), Keycloak (JWKS) and Bugsink. Three small policies let SurrealDB, the
#     Python API and Bugsink accept pk-api; 10-networkpolicy.yaml is unchanged.
#
# Placeholders are the same as the numbered manifests (infra/render.sh fills them); __IMAGE_REF_RS__ is the pk-api
# digest. Paths moved per group, in this order, each its own step with its own deploy-log line:
#   1. /api/health /api/labels /api/decisions /api/learned /api/meta /api/pipeline   (this file; GET-only on the
#      Python too, so exact paths are enough)
#   2. later groups (T9 continued: /api/search, /api/today, /api/export, /api/audio/<id>, /api/backend; then the GET
#      halves of /api/jokes and /api/sets) are added here as exact paths, or with a regex path and
#      `nginx.ingress.kubernetes.io/use-regex`, never as a prefix while the Python owns a write under it.
# Measure before moving step 1 (docs/ARCHITECTURE.md section 8): Python p95 per route off Grafana; pk-api's in the T9
# report (docs/RUST_WORKSTREAM.md T9).
apiVersion: v1
kind: Service
metadata: { name: punchable-api-rs, namespace: punchable, labels: { app: punchable-api-rs, impl: rust } }
spec:
  selector: { app: punchable-api-rs }
  ports: [ { name: http, port: 80, targetPort: 8080 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: punchable-api-rs, namespace: punchable, labels: { impl: rust } }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  minReadySeconds: 5
  selector: { matchLabels: { app: punchable-api-rs } }
  template:
    metadata: { labels: { app: punchable-api-rs, impl: rust } }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # pk-api flips readiness to 503 on SIGTERM, waits 10 s, then drains (no preStop: the image has no shell)
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: __IMAGE_REF_RS__
          ports: [ { containerPort: 8080 } ]
          env:
            - { name: PORT, value: "8080" }
            - { name: PK_AUTH, value: "1" }
            # only the paths /api/health names; pk-api writes nothing to disk
            - { name: PK_DATA, value: /tmp/punchable }
            - { name: PK_OWNER_ID, value: "__PK_OWNER_ID__" }
            - { name: PUBLIC_URL, value: "https://__PK_DOMAIN__" }
            - { name: OIDC_ISSUER, value: "https://__PK_AUTH_HOST__/realms/__PK_REALM__" }
            - { name: OIDC_AUDIENCE, value: pk-api }
            - { name: OIDC_JWKS_URL, value: "http://keycloak.__PK_KC_NS__.svc.cluster.local/realms/__PK_REALM__/protocol/openid-connect/certs" }
            - { name: SURREAL_URL, value: "ws://surrealdb:8000/rpc" }
            - { name: SURREAL_NS, value: punchable }
            - { name: SURREAL_DB, value: main }
            # T9 only: everything pk-api does not answer goes to the Python Service unchanged
            - { name: PK_PYTHON_URL, value: "http://punchable-api.punchable.svc.cluster.local" }
            - { name: RUST_LOG, value: info }
            # search's query and passage vectors (round 6), loaded on the first search, not at start. rust/Dockerfile.api
            # (round 7) puts the model at this path (tools/kb/fetch_bge.py, as rust/Dockerfile.worker does). An empty
            # folder (built with PK_WITH_BGE=0) = words-only search and a warning in the log ("PK_BGE_DIR holds no
            # model")
            - { name: PK_BGE_DIR, value: /opt/punchable/models/bge-small-en-v1.5 }
          envFrom:
            # SURREAL_API_USER / SURREAL_API_PASS (database EDITOR, never root) and SENTRY_DSN: the same Secrets
            - secretRef: { name: punchable-api }
            - secretRef: { name: punchable-sentry, optional: true }
            # PK_APP_FLAGS, when it is set for the Python, must be set here too (/api/health answers it)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          # the model once loaded adds its weights and runtime (measured in the T9 round-6 row of
          # docs/RUST_WORKSTREAM.md); the T15 measurement sets the request
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe:
            httpGet: { path: "/api/health?ready=1", port: 8080 }
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/health, port: 8080 }
            timeoutSeconds: 3
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 5
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: punchable-api-rs
  namespace: punchable
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/limit-connections: "25"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: public
  tls:
    - hosts: [__PK_DOMAIN__]
      secretName: punchable-tls
  rules:
    - host: __PK_DOMAIN__
      http:
        paths:
          - { path: /api/health, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: /api/labels, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: /api/decisions, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: /api/learned, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: /api/meta, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: /api/pipeline, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          # step 2 (GET-only on the Python too): the cloud map, Python's slowest route under load
          - { path: /api/map/cloud, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          # step 3 (GET-only on the Python too): the Sets list
          - { path: /api/sets, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          # round 5 (GET-only on the Python too): the Bits list; since round 6 its `?mode=hybrid` search too
          - { path: /api/jokes, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          # round 6 (GET-only on the Python too): search over bits and taped moments, with the model
          - { path: /api/search, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          # round 5 (GET-only on the Python too): the Today feed (its `inbox` count is the Python pod's upload folder until
          # T10; the app does not read it)
          - { path: /api/today, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          # round 7: the creative lists. /api/settings (PATCH), /api/boards (POST) and /api/mysets (POST) carry writes
          # on the Python: an exact path moves every method, and pk-api forwards each write unchanged (`read_route`'s
          # fallback), so nothing is swallowed. /api/tonight/screen asks the Python for the worker's status
          # (GET /api/ai/worker, added in the same commit): DEPLOY THE PYTHON API WITH THAT ROUTE FIRST, or the
          # Tonight screen answers 502 until it is there.
          - { path: /api/settings, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: /api/boards, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: /api/mysets, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: /api/tonight/screen, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          # round 8: his voice profile (PUT on the Python: forwarded) and the "not a joke?" list (GET only)
          - { path: /api/profile/voice, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: /api/suggestions/not-a-joke, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          # round 8: the working sets (POST on the Python: forwarded)
          - { path: /api/workingsets, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          # round 8: "From your notebook" (GET only; the fused search with the model, as /api/search)
          - { path: /api/notebook/related, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          # T10 group 1 (POST only on the Python too): a jot, a set transcribed on the phone. pk-api writes the
          # decision row (the database's own event bumps `gen`, which the Python's reads and /api/live hub follow) and
          # the creative_event rows (the Python's next request finds them: its file is extended, never diverged).
          # DEPLOY ORDER: this step needs nothing new on the Python side; move group 1 and watch the Python's log for
          # "differ" lines (a divergence refuses its creative writes) before group 2.
          - { path: /api/ideas, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: /api/sets/transcript, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          # T10 group 2 (POST only on the Python too): one bit's writes and the merges. /api/merge is an exact path:
          # /api/merge/candidates and /api/merge/history (GETs) stay the Python's until round 2.
          - { path: /api/decision, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: /api/undo, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: /api/merge, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: /api/merge/attach, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: /api/merge/dismiss, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: /api/merge/undo, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          # T10 group 3 (round 2): the Set page's writes, the Tonight list; /api/boards and /api/workingsets (already
          # exact paths above for their GET) now take their POST here too, /api/settings its PATCH, /api/profile/voice
          # its PUT
          - { path: /api/review/rate, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: /api/set-row, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: /api/review/reject-match, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: /api/tonight, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          # T10 group 4 (round 2): the voice profile's learn, the "not a joke?" answers
          - { path: /api/profile/voice/learn, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: /api/suggestions/not-a-joke/keep, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: /api/suggestions/not-a-joke/hide, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          # T10 round 2: the merge candidates (GET only on the Python too)
          - { path: /api/merge/candidates, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          # T10 round 3 (group 5): the live socket and the hosted worker's routes. DEPLOY ORDER: the Python image
          # with this round's api-dev changes FIRST (its claim route writes `worker:seen` and its Tonight/Connections
          # read it; its sweeper takes `lease:embedder`), then pk-api (which applies db/schema_extra.surql's two new
          # tables at start as the Python does). /api/live is a WebSocket: ingress-nginx passes the Upgrade; the
          # proxy-read-timeout of 60 s above is longer than the server's 20 s keep-alive ping.
          - { path: /api/live, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: /api/worker/claim, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: /api/worker/decisions, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: /api/worker/creative, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: /api/worker/profile/voice, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          # T10 round 3 (group 6, the cheap half; POST only on the Python too): the one-shot questions and the imports
          # that only queue a job. /api/ask is an exact path; the conversations (/api/ask/chats*) moved in round 5, below.
          - { path: /api/ask, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: /api/riff, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: /api/facts, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: /api/import/youtube, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          # T10 round 4 (group 6a): the inbox and the voice memos (GET only on the Python too). /api/memos is an exact
          # path; the memo pages are regex paths below. POST /api/upload is in its own Ingress at the end of this file
          # (a recording streams through: 1 GB, no request buffering, a long timeout, none of which this one has).
          # DEPLOY ORDER: the Python image first (an upload is `upload` / `upload_part` rows for both servers, the
          # `upload` tables come from db/schema_extra.surql which the Python applies at its start and pk-api does not
          # re-apply once a schema sha is stored), then pk-api. Uploads made by the old Python pod are in its inbox
          # folder and are not listed by the new code: drain the inbox (the transcriber, or drop the jobs) before the
          # Python image changes.
          # UPLOADS IN THE DATABASE ARE OFF BY DEFAULT (docs/adr/0014, accepted on the lead's defaults 2026-11-06: 64 MiB cap
          # with a 413, bytes deleted on a drop / a final failure / a done job / after 7 days unclaimed, rows left out of the
          # nightly export): the deploy sets PK_UPLOAD_DB=1 on BOTH Deployments. Off, pk-api answers POST /api/upload with 503 (so do not apply the upload Ingress at the
          # end of this file), forwards /api/inbox and the transcriber's fetch to the Python, and the inbox folder is the home.
          - { path: /api/inbox, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: /api/memos, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          # T10 round 4 (group 6b): what was folded into a bit (GET only on the Python too). One merge record is the
          # regex path below; /api/merge/attach, /dismiss and /undo are exact paths above and win over it.
          - { path: /api/merge/history, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          # T10 round 5 (group A): the Ask conversations (GET and POST on the list; the conversation's own page is the
          # regex path below). A GET settles a finished answer by writing events, so both servers write this store
          # until the Python is retired; either reads what the other wrote.
          - { path: /api/ask/chats, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          # T10 round 5 (group B): the rooms and the map's pins (GET only on the Python too; the pin edit is the PATCH on
          # the regex path below). The geocoder is never asked a question (PK_GEOCODE stays unset): the pins come from the
          # cache row.
          - { path: /api/venues, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: /api/venues.geojson, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
---
# Step 4: the id pages (pk-api OWN_PATTERNS): one bit's page and a set's analysis and review. An id cannot be an
# exact path, and a prefix would also move the writes and the creative GETs under them, so these are regex paths, each
# anchored to exactly one id segment; the other paths under an id stay on the
# Python's Ingress; /api/jokes/<id>/similar (GET-only on the Python too) moved in round 6, /connections, /map and the
# board / set pages in round 8. Its own object, so it can be deleted alone.
# Check before applying (UNKNOWN on this cluster): ingress-nginx applies use-regex to every path of the host, across
# Ingresses; render both Ingresses and read the generated nginx.conf locations for /api/health and /api/jokes first.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: punchable-api-rs-ids
  namespace: punchable
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    # a job's result takes up to 8 MiB (writes/worker.rs WORKER_BODY); the nginx default is 1m
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/limit-connections: "25"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: public
  tls:
    - hosts: [__PK_DOMAIN__]
      secretName: punchable-tls
  rules:
    - host: __PK_DOMAIN__
      http:
        paths:
          - { path: "/api/jokes/[^/]+$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: "/api/jokes/[^/]+/similar$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: "/api/sets/[^/]+/analysis$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: "/api/sets/[^/]+/review$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          # round 8: one set list, one of his sets, one bit's connections. PATCH /api/boards/<id> and
          # PATCH /api/mysets/<id> are writes on the Python: pk-api forwards every method it does not answer, and
          # /api/mysets/match (the Python's route, not a set id) whatever the method.
          - { path: "/api/boards/[^/]+$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: "/api/boards/[^/]+/build$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: "/api/mysets/[^/]+$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: "/api/mysets/[^/]+/trim$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: "/api/jokes/[^/]+/connections$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: "/api/jokes/[^/]+/map$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: "/api/jobs/[^/]+$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: "/api/workingsets/[^/]+$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: "/api/workingsets/[^/]+/nights$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: "/api/workingsets/[^/]+/bits/[^/]+$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: "/api/sets/[^/]+/clips$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          # T10 group 2: his new version of a bit (POST only on the Python too)
          - { path: "/api/jokes/[^/]+/versions$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          # T10 round 2 (group 3): one bit's punch-up, a set list's items and bridge, a set's versions, locks, try notes
          # and punch-ups. "/api/boards/[^/]+$" above now carries its PATCH here too.
          - { path: "/api/jokes/[^/]+/punchup$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: "/api/boards/[^/]+/items$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: "/api/boards/[^/]+/bridge$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: "/api/workingsets/[^/]+/versions$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: "/api/workingsets/[^/]+/lock$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: "/api/workingsets/[^/]+/try$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: "/api/workingsets/[^/]+/try/[^/]+$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: "/api/workingsets/[^/]+/bits/[^/]+/punchup$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          # Film it (build 24): "Make it a rant" and "Pick a hook" on one version (POST only on the Python too)
          - { path: "/api/jokes/[^/]+/rant$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: "/api/jokes/[^/]+/hook$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          # T10 round 3 (group 5): a job's result (POST only on the Python too); ".../file$" stays the Python's
          - { path: "/api/worker/jobs/[^/]+/result$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          # T10 round 3 (group 6): his drop of a queued job (POST only on the Python too)
          - { path: "/api/jobs/[^/]+/drop$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          # T10 round 4 (group 6a): a memo, its audio (always the 404 the Python gives: no audio is in the database),
          # and the transcriber's fetch of an upload (GET only on the Python too)
          - { path: "/api/memos/[^/]+$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: "/api/memos/[^/]+/audio$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: "/api/worker/jobs/[^/]+/file$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          - { path: "/api/merge/[^/]+$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          # T10 round 5 (group A): one conversation (GET settles it, POST asks a follow-up, PATCH renames or hides it)
          - { path: "/api/ask/chats/[^/]+$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
          # T10 round 5 (group B): his pin move, rename or reset (PATCH only on the Python too)
          - { path: "/api/venues/[^/]+$", pathType: ImplementationSpecific, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
---
# T10 round 4 (group 6a): POST /api/upload, the phone's recording (at most 64 MiB with the database as its home, ADR 0014;
# the servers answer 413 from Content-Length, so nginx's limit stays above it and the app gets the JSON error). The Python's own
# Ingress (50-ingress.yaml) carries these annotations for it; the others here do not, so the upload is its own object:
# no body-size cap beyond 1 GB, the body streams through (pk-api writes it to the database a megabyte at a time), and a
# slow phone link gets an hour.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: punchable-api-rs-upload
  namespace: punchable
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1g"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/limit-connections: "25"
spec:
  ingressClassName: public
  tls:
    - hosts: [__PK_DOMAIN__]
      secretName: punchable-tls
  rules:
    - host: __PK_DOMAIN__
      http:
        paths:
          - { path: /api/upload, pathType: Exact, backend: { service: { name: punchable-api-rs, port: { number: 80 } } } }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: punchable-api-rs
  namespace: punchable
  labels: { app: punchable-api-rs, release: prometheus }
spec:
  jobLabel: app
  podTargetLabels: [impl]
  selector: { matchLabels: { app: punchable-api-rs } }
  namespaceSelector: { matchNames: [punchable] }
  endpoints:
    - { port: http, path: /metrics, interval: 30s, scrapeTimeout: 10s }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: punchable-api-rs, namespace: punchable }
spec:
  podSelector: { matchLabels: { app: punchable-api-rs } }
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - ipBlock: { cidr: __PK_ORIGIN_IP__/32 }
      ports:
        - { protocol: TCP, port: 8080 }
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: observability } }
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - podSelector: { matchLabels: { app: surrealdb } }
      ports:
        - { protocol: TCP, port: 8000 }
    - to:
        - podSelector: { matchLabels: { app: punchable-api } }
      ports:
        - { protocol: TCP, port: 8080 }
    - to:
        - podSelector: { matchLabels: { app: punchable-bugsink } }
      ports:
        - { protocol: TCP, port: 8000 }
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: __PK_KC_NS__ } }
          podSelector: { matchLabels: { app: keycloak } }
      ports:
        - { protocol: TCP, port: 8080 }
---
# the three counterparts: SurrealDB, the Python API (the fallback) and Bugsink accept pk-api
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: surrealdb-from-api-rs, namespace: punchable }
spec:
  podSelector: { matchLabels: { app: surrealdb } }
  policyTypes: ["Ingress"]
  ingress:
    - from: [ { podSelector: { matchLabels: { app: punchable-api-rs } } } ]
      ports: [ { protocol: TCP, port: 8000 } ]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: punchable-api-from-api-rs, namespace: punchable }
spec:
  podSelector: { matchLabels: { app: punchable-api } }
  policyTypes: ["Ingress"]
  ingress:
    - from: [ { podSelector: { matchLabels: { app: punchable-api-rs } } } ]
      ports: [ { protocol: TCP, port: 8080 } ]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: punchable-bugsink-from-api-rs, namespace: punchable }
spec:
  podSelector: { matchLabels: { app: punchable-bugsink } }
  policyTypes: ["Ingress"]
  ingress:
    - from: [ { podSelector: { matchLabels: { app: punchable-api-rs } } } ]
      ports: [ { protocol: TCP, port: 8000 } ]
